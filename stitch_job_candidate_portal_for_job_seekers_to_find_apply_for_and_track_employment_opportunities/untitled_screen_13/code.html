<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #1993e5;
        --secondary-color: #f0f2f4;
        --background-color: #f9f9f9;
        --text-primary: #111418;
        --text-secondary: #637488;
        --accent-color: #e0e7ff;
      }
      body {
        font-family: 'Manrope', sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
      }
      .button_primary {
        @apply bg-[var(--primary-color)] text-white rounded-lg px-4 py-2 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50;
      }
      .input {
        @apply bg-white border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex size-full min-h-screen flex-col bg-[var(--background-color)] justify-between group/design-root overflow-x-hidden">
<div>
<header class="p-4">
<div class="flex items-center justify-between">
<button class="text-[var(--text-primary)]">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
</svg>
</button>
<h2 class="text-lg font-bold text-center flex-1 text-[var(--text-primary)]">Complete your profile</h2>
<div class="w-6"></div>
</div>
<div class="flex justify-center items-center gap-2 pt-6 pb-4">
<div class="w-1/3 h-1 bg-[var(--primary-color)] rounded-full"></div>
<div class="w-1/3 h-1 bg-gray-200 rounded-full"></div>
<div class="w-1/3 h-1 bg-gray-200 rounded-full"></div>
</div>
</header>
<main class="px-4">
<h1 class="text-2xl font-bold text-[var(--text-primary)] mb-6">Personal Information</h1>
<form class="space-y-4">
<div>
<label class="text-sm font-medium text-[var(--text-secondary)]" for="full-name">Full Name</label>
<input class="form-input mt-1 block w-full rounded-lg border-gray-300 bg-white px-4 py-3 text-[var(--text-primary)] placeholder:text-gray-400 focus:border-blue-500 focus:ring-blue-500" id="full-name" placeholder="Enter your full name" type="text"/>
</div>
<div>
<label class="text-sm font-medium text-[var(--text-secondary)]" for="email">Email</label>
<input class="form-input mt-1 block w-full rounded-lg border-gray-300 bg-white px-4 py-3 text-[var(--text-primary)] placeholder:text-gray-400 focus:border-blue-500 focus:ring-blue-500" id="email" placeholder="Enter your email address" type="email"/>
</div>
<div>
<label class="text-sm font-medium text-[var(--text-secondary)]" for="phone-number">Phone Number</label>
<input class="form-input mt-1 block w-full rounded-lg border-gray-300 bg-white px-4 py-3 text-[var(--text-primary)] placeholder:text-gray-400 focus:border-blue-500 focus:ring-blue-500" id="phone-number" placeholder="Enter your phone number" type="tel"/>
</div>
<div>
<label class="text-sm font-medium text-[var(--text-secondary)]" for="location">Location</label>
<input class="form-input mt-1 block w-full rounded-lg border-gray-300 bg-white px-4 py-3 text-[var(--text-primary)] placeholder:text-gray-400 focus:border-blue-500 focus:ring-blue-500" id="location" placeholder="Enter your location" type="text"/>
</div>
</form>
</main>
</div>
<footer class="p-4">
<button class="w-full h-12 rounded-xl bg-[var(--primary-color)] text-white text-base font-bold">
          Next
        </button>
</footer>
</div>

</body></html>
