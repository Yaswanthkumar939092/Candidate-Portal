<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #1993e5;
        --secondary-color: #f0f2f4;
        --background-color: #f9f9f9;
        --text-primary: #111418;
        --text-secondary: #637488;
        --accent-color: #e0e7ff;
      }
      body {
        font-family: 'Manrope', sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
      }
      .button_primary {
        @apply bg-[var(--primary-color)] text-white rounded-lg px-4 py-2 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50;
      }
      .button_secondary {
        @apply bg-[var(--secondary-color)] text-[var(--text-primary)] rounded-lg px-4 py-2 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50;
      }
      .input {
        @apply bg-white border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[var(--background-color)]">
<div class="relative flex size-full min-h-screen flex-col justify-between group/design-root overflow-x-hidden">
<div class="p-6">
<div class="flex items-center justify-between mb-12">
<button class="icon_button">
<svg class="text-[var(--text-primary)]" fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
</svg>
</button>
<h1 class="text-xl font-bold text-[var(--text-primary)]">Sign In</h1>
<div class="w-6"></div>
</div>
<div class="space-y-6">
<div>
<label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="email">Email</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[var(--text-primary)] focus:outline-0 focus:ring-2 focus:ring-[var(--primary-color)] border-gray-300 bg-white h-14 placeholder:text-gray-400 p-4 text-base font-normal leading-normal" id="email" placeholder="you@example.com" type="email" value=""/>
</div>
<div>
<label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="password">Password</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[var(--text-primary)] focus:outline-0 focus:ring-2 focus:ring-[var(--primary-color)] border-gray-300 bg-white h-14 placeholder:text-gray-400 p-4 text-base font-normal leading-normal" id="password" placeholder="••••••••" type="password" value=""/>
</div>
</div>
<div class="mt-8">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-4 bg-[var(--primary-color)] text-white text-base font-bold leading-normal tracking-wide shadow-sm hover:bg-blue-600 transition-colors">
<span class="truncate">Sign In</span>
</button>
</div>
<div class="text-center mt-6">
<a class="text-sm font-medium text-[var(--primary-color)] hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-300"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="bg-[var(--background-color)] px-2 text-[var(--text-secondary)]">Or continue with</span>
</div>
</div>
<div class="flex flex-col sm:flex-row gap-4">
<button class="flex items-center justify-center w-full gap-3 py-3 px-4 rounded-lg bg-white border border-gray-300 hover:bg-gray-50 transition-colors">
<svg class="size-5" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_120_334)"><path d="M47.523 24.5528C47.523 22.9248 47.3821 21.2968 47.0991 19.72H24.2383V28.7112H37.3631C36.758 31.7824 35.0311 34.3408 32.4867 36.0128V41.7808H40.2003C44.7827 37.6208 47.523 31.68 47.523 24.5528Z" fill="#4285F4"></path><path d="M24.2383 48.0001C30.8291 48.0001 36.3315 45.8913 40.2003 41.7809L32.4867 36.0129C30.1323 37.5889 27.3511 38.5393 24.2383 38.5393C18.4235 38.5393 13.4355 34.7809 11.7515 29.5361H3.8584V35.4385C7.72718 43.2385 15.3951 48.0001 24.2383 48.0001Z" fill="#34A853"></path><path d="M11.7516 29.536C11.3832 28.384 11.1648 27.16 11.1648 25.8896C11.1648 24.6192 11.3832 23.3952 11.7516 22.2432V16.3408H3.85848C1.40408 21.1408 0 26.3856 0 32.3216C0 38.2576 1.40408 43.5024 3.85848 48.3024L11.7516 42.4" fill="#FBBC05" transform="translate(0 -15.9784)"></path><path d="M24.2383 9.46094C27.8487 9.46094 31.0595 10.7097 33.6283 13.1529L40.4075 6.37374C36.3315 2.76334 30.8291 0.521484 24.2383 0.521484C15.3951 0.521484 7.72718 5.28294 3.8584 13.0829L11.7515 18.9854C13.4355 13.7405 18.4235 9.46094 24.2383 9.46094Z" fill="#EA4335" transform="translate(0 2.59766)"></path></g><defs><clipPath id="clip0_120_334"><rect fill="white" height="48" transform="translate(0 0.260742)" width="48"></rect></clipPath></defs></svg>
<span class="text-sm font-semibold text-[var(--text-primary)]">Google</span>
</button>
<button class="flex items-center justify-center w-full gap-3 py-3 px-4 rounded-lg bg-white border border-gray-300 hover:bg-gray-50 transition-colors">
<svg class="size-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452H20.452V20.447H20.447V20.452ZM20.452 13.4C20.452 13.4 20.447 13.4 20.447 13.4C20.447 16.632 18.307 18.472 15.827 18.472C14.122 18.472 13.057 17.587 12.562 16.782H12.482V18.237H8.5V9.7H12.607V11.232C13.217 10.327 14.342 9.46201 16.142 9.46201C18.667 9.46201 20.452 11.137 20.452 13.4ZM4.125 7.96201H0V18.237H4.125V7.96201ZM2.062 6.58701C3.207 6.58701 4.125 5.66951 4.125 4.52451C4.125 3.37951 3.207 2.46201 2.062 2.46201C0.917 2.46201 0 3.37951 0 4.52451C0 5.66951 0.917 6.58701 2.062 6.58701Z" fill="#0A66C2" transform="translate(1.5 2.5)"></path></svg>
<span class="text-sm font-semibold text-[var(--text-primary)]">LinkedIn</span>
</button>
</div>
</div>
<div class="pb-6 px-6 text-center">
<p class="text-sm text-[var(--text-secondary)]">
          Don't have an account?
          <a class="font-bold text-[var(--primary-color)] hover:underline" href="#">Sign up</a>
</p>
</div>
</div>

</body></html>
