<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
      :root {
        --primary-color: #1993e5;
        --secondary-color: #f0f2f4;
        --background-color: #f9f9f9;
        --text-primary: #111418;
        --text-secondary: #637488;
        --accent-color: #e0e7ff;
      }
      body {
        font-family: "Manrope", sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
      }
      .card {
        @apply bg-white rounded-lg shadow-md p-6;
      }
      .button_primary {
        @apply bg-[var(--primary-color)] text-white rounded-lg px-4 py-2 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50;
      }
      .button_secondary {
        @apply bg-[var(--secondary-color)] text-[var(--text-primary)] rounded-lg px-4 py-2 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50;
      }
      .input {
        @apply bg-white border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500;
      }
      .typography_h1 {
        @apply text-3xl font-bold text-[var(--text-primary)];
      }
      .typography_h2 {
        @apply text-2xl font-semibold text-[var(--text-primary)];
      }
      .typography_body {
        @apply text-base text-[var(--text-secondary)];
      }
      .list_item {
        @apply flex items-center py-2 border-b border-gray-200 last:border-none;
      }
      .list_item_icon {
        @apply mr-2 text-[var(--primary-color)];
      }
      .list_item_text {
        @apply text-[var(--text-primary)];
      }
      .tab_active {
        @apply bg-[var(--primary-color)] text-white rounded-lg px-4 py-2;
      }
      .tab_inactive {
        @apply text-[var(--text-secondary)] hover:text-[var(--text-primary)] px-4 py-2;
      }
      .icon_button {
        @apply p-2 rounded-full hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50;
      }
      .avatar {
        @apply rounded-full w-12 h-12 object-cover;
      }
      .badge {
        @apply inline-block bg-[var(--accent-color)] text-[var(--primary-color)] text-xs font-medium px-2.5 py-0.5 rounded-full;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
